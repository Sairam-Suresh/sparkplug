[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sparkplug"
version = "0.1.0"
description = "Lightweight daemon and Docker service for Wake-on-LAN and SSH shutdown via Caddy reverse proxy"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "SparkPlug Contributors" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "asyncssh>=2.14.0",
    "jinja2>=3.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-mock>=3.12.0",
    "httpx>=0.27.0",
]

[project.scripts]
sparkplug = "src.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["src"]

